name: Create Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Read version and create tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        id: create-tag
        run: |
          git tag "v${{ steps.version.outputs.v }}"
          git push origin "v${{ steps.version.outputs.v }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release build
        if: steps.check.outputs.exists == 'false'
        run: |
          gh workflow run release.yml \
            -f release_tag="v${{ steps.version.outputs.v }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
